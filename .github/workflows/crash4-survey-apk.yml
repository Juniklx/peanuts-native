# PEANUTS: Crash 4 feasibility survey only, NOT a playable profile.
# No game data, ROMs, keys, compiled shaders or binary dumps are uploaded.
name: Crash 4 Android metadata survey APK

on:
  push:
    branches:
      - feat/crash4-android-survey
    paths:
      - '.github/workflows/crash4-survey-apk.yml'
      - 'android/app/src/main/java/dev/nxnative/android/Crash4Survey.java'
      - 'android/app/src/main/java/dev/nxnative/android/MainActivity.java'
      - 'peanuts/docs/CRASH4-ANDROID-SURVEY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    if: github.repository == 'Juniklx/peanuts-native'
    name: Build read-only Crash 4 identification app
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'
      - name: Preflight source and existing profile
        run: |
          sh peanuts/scripts/check-profiles.sh 0400486024DEC000
          python3 dm/peanuts/profile/gen_runtime_profile.py check-all
          python3 - <<'PY'
          from pathlib import Path
          s=Path('android/app/src/main/java/dev/nxnative/android/Crash4Survey.java').read_text()
          ui=Path('android/app/src/main/java/dev/nxnative/android/MainActivity.java').read_text()
          assert '010073401175E000' in s
          assert 'BuildCheck.nsoBuildId(mod.head(0x60), name)' in s
          assert 'Crash4Survey.report(g)' in ui and 'Copy metadata' in ui
          assert 'Profile.missing(k.id' in ui
          print('Crash 4 read-only header survey is wired to the unsupported-game dialog')
          PY
      - name: Install Android SDK/NDK and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Compile isolated Crash 4 metadata APK
        working-directory: android/app
        run: |
          # Google mirror avoids Maven Central HTTP 429 observed on prior CI jobs.
          python3 - <<'PY'
          from pathlib import Path
          path=Path('settings.gradle')
          data=path.read_text()
          assert data.count('mavenCentral()') == 2
          data=data.replace('mavenCentral()', 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }; mavenCentral()')
          path.write_text(data)
          PY
          chmod +x ./gradlew
          # PEANUTS: one pre-existing source profile only as a launcher carrier.
          # Crash 4 stays unsupported; fake engine cannot prepare playable packs.
          ./gradlew apk --no-daemon \
            -PnxApp=peanuts \
            -PnxAppId=crash4survey \
            -PnxLabel="Peanuts Crash 4 survey" \
            -PnxGames=0400486024DEC000 \
            -PnxPackEngine=fake
          test -s out/nxnative-android-peanuts.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash4-metadata-survey-apk
          path: android/app/out/nxnative-android-peanuts.apk
          retention-days: 7
          if-no-files-found: error
