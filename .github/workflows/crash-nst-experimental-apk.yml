# PEANUTS: source-only experimental Crash Bandicoot N. Sane Trilogy test app. No game data, keys, ROMs or compiled shaders are uploaded.
# PEANUTS: crashnstfpstest is isolated from the official app, TUNIC apps and the first crashnsttest build. Fresh GitHub debug signing keys cannot update old APKs.
name: Crash NST experimental Android APK

on:
  push:
    branches:
      - feat/crash-nst-android-experimental
    paths:
      - '.github/workflows/crash-nst-experimental-apk.yml'
      - 'dm/games/0100D1B006744000/**'
      - 'peanuts/docs/CRASH-NST-ANDROID.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Crash NST test APK with native on-device Prepare
    if: github.repository == 'Juniklx/peanuts-native'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # PEANUTS: GitHub's ubuntu-24.04 image does not put sdkmanager on PATH.
      # This pinned action installs Android command-line tools, accepts SDK licences, and exports the SDK location.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Preflight public profile and documentation
        run: |
          python3 -m py_compile dm/tools/patch_nso.py
          python3 -m py_compile dm/gfx/tools/iga.py dm/gfx/tools/shader_split.py dm/tools/tests/test_split_iga12.py dm/tools/tests/test_split_iga.py
          python3 dm/tools/tests/test_split_iga12.py  # PEANUTS: synthetic v12 archive only, no game assets
          mkdir -p "$RUNNER_TEMP/packrebind-jvm"
          javac -d "$RUNNER_TEMP/packrebind-jvm" android/app/src/ondevice/java/dev/nxnative/android/PackRebind.java android/app/src/jvmtest/java/dev/nxnative/android/PackRebindJvmTest.java
          java -cp "$RUNNER_TEMP/packrebind-jvm" dev.nxnative.android.PackRebindJvmTest
          python3 dm/tools/tests/test_docs.py GameNotes # PEANUTS: repository-wide legacy links fail independently of Crash NST
          sh peanuts/scripts/check-profiles.sh 0100D1B006744000
          python3 dm/peanuts/profile/gen_runtime_profile.py check-all

      - name: Install Android NDK, SDK and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ninja-build cmake
          sdkmanager --version
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build the native on-device preparation engine
        run: |
          zsh peanuts/scripts/ondevice-stage.sh "$RUNNER_TEMP/crashnst-ondevice" all
          test -s "$RUNNER_TEMP/crashnst-ondevice/stage/lib/libdmsh_xlate.so"
          test -s "$RUNNER_TEMP/crashnst-ondevice/stage/lib/libnxpack.so"

      # PEANUTS: to make *future* APKs updatable, configure a GitHub Actions secret
      # CRASH_NST_TEST_KEYSTORE_B64 containing a base64-encoded private keystore
      # with Android's conventional debug alias/password. Never commit that file.
      # Without the secret, each runner generates its own temporary signing key.
      - name: Restore persistent test signing key, when configured
        shell: bash
        env:
          CRASH_NST_TEST_KEYSTORE_B64: ${{ secrets.CRASH_NST_TEST_KEYSTORE_B64 }}
        run: |
          if [ -n "$CRASH_NST_TEST_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$CRASH_NST_TEST_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "Persistent test signing key restored (private content not printed)"
          else
            echo "::warning::No CRASH_NST_TEST_KEYSTORE_B64 secret. This APK will be debug-signed by the runner; future Actions APKs may have incompatible signatures."
          fi

      - name: Compile isolated Peanuts test APK (Crash NST only)
        working-directory: android/app
        run: |
          # PEANUTS: Maven Central can return HTTP 429 to GitHub-hosted runners.
          # Prefer Google's public Maven Central mirror in this isolated CI job;
          # keep the original mavenCentral() fallback and leave repository sources unchanged.
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("settings.gradle")
          before = settings.read_text()
          assert before.count("mavenCentral()") == 2, "Unexpected Gradle repository layout"
          mirror = 'maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }; mavenCentral()'
          settings.write_text(before.replace("mavenCentral()", mirror))
          PY
          chmod +x ./gradlew
          ./gradlew apk --no-daemon \
            -PnxApp=peanuts \
            -PnxAppId=crashnstfpstest \
            -PnxLabel="Peanuts Crash NST FPS test" \
            -PnxGames=0100D1B006744000 \
            -PnxPackStage="$RUNNER_TEMP/crashnst-ondevice/stage"
          test -s out/nxnative-android-peanuts.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-nst-experimental-apk
          path: android/app/out/nxnative-android-peanuts.apk
          if-no-files-found: error
          retention-days: 7
